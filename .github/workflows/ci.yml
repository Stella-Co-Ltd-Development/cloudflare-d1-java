name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - java: "8"
            distribution: temurin
          - java: "11"
            distribution: temurin
          - java: "15"
            distribution: zulu
          - java: "17"
            distribution: temurin
          - java: "21"
            distribution: temurin

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Test
        run: mvn -B clean verify

  release-profile:
    name: Verify release profile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify release artifacts
        run: mvn -B -Prelease -Dgpg.skip=true verify

  examples:
    name: Compile and run examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install current library
        run: mvn -B -DskipTests install

      - name: Read current project version
        id: project-version
        run: echo "version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" >> "$GITHUB_OUTPUT"

      - name: Compile examples
        run: >-
          mvn -B -f examples/quickstart/pom.xml
          -Dcloudflare-d1-java.version=${{ steps.project-version.outputs.version }}
          compile

      - name: Run credential-free custom transport example
        run: >-
          mvn -B -f examples/quickstart/pom.xml
          -Dcloudflare-d1-java.version=${{ steps.project-version.outputs.version }}
          exec:java
          -Dexec.mainClass=example.CustomTransportExample
